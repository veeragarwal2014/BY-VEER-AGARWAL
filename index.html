    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(34, 197, 94, 0.05) 50%, transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }
    </style>
